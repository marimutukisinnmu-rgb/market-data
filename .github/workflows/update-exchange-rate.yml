name: Update Exchange Rate

on:
  schedule:
    # 毎日 18:00 JST（09:00 UTC）
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exchange rate
        run: |
          mkdir -p data
          curl -fsSL "https://api.frankfurter.dev/v1/latest" \
            -o data/exchange-rate.json

      - name: Add source
        run: |
          python - <<'PY'
          import json

          path = "data/exchange-rate.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["source"] = "https://api.frankfurter.dev/v1/latest"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rate.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update exchange rate"
          git push
