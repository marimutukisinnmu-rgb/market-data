name: Update Market Data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Frankfurter data
        run: |
          mkdir -p data
          curl -fsSL "https://api.frankfurter.dev/v1/latest" -o data/exchange-rate.json

      - name: Add source and create human-readable file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("data/exchange-rate.json")
          text_path = Path("data/market-data.json.txt")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          data["source"] = "https://api.frankfurter.dev/v1/latest"
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          rates = data.get("rates", {})
          base = data.get("base", "EUR")
          date = data.get("date", "unknown")
          amount = data.get("amount", 1.0)

          lines = [
              "==============================",
              "        MARKET DATA",
              "==============================",
              "",
              "日経平均",
              "現在値 : 未取得",
              "日時   : 未取得",
              "",
              "------------------------------",
              "為替レート",
              "------------------------------",
              "",
              f"取得日   : {date}",
              f"基準通貨 : {base}",
              f"金額     : {amount}",
              "",
              "【EUR 基準】",
              "",
          ]

          for currency, value in rates.items():
              lines.append(f"EUR/{currency}")
              lines.append(f"1 EUR = {value} {currency}")
              lines.append("")

          jpy_rate = rates.get("JPY")
          if jpy_rate:
              lines += ["【JPY 基準】", ""]
              for currency, value in rates.items():
                  if currency == "JPY":
                      continue
                  converted = value / jpy_rate
                  lines.append(f"JPY/{currency}")
                  lines.append(f"1 JPY = {converted:.10f} {currency}")
                  lines.append("")

          lines += [
              "------------------------------",
              "出典",
              "------------------------------",
              "",
              "日経平均 : 未設定",
              "為替     : Frankfurter API",
              "           https://api.frankfurter.dev/v1/latest",
              "",
              "==============================",
          ]
          text_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rate.json data/market-data.json.txt
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update market data"
          git push
